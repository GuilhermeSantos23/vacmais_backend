[project]
name = "vacmais-backend"
version = "0.1.0"
description = "Backend do sistema Vac+"
authors = [
    {name = "VacMais"}
]
[tool.poetry.dependencies]
python = ">=3.10,<4.0"
fastapi = {extras = ["standard"], version = "^0.136.1"}
uvicorn = "^0.46.0"
pydantic = "^2.13.3"
sqlalchemy = "^2.0.49"
psycopg2-binary = "^2.9.12"
python-dotenv = "^1.2.2"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-jose = "^3.5.0"
python-multipart = "^0.0.28"
bcrypt = "4.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.4.0"
taskipy = "^1.12.0"
coverage = "^7.0.0"
pytest-cov = "^7.1.0"

[tool.taskipy.tasks]
lint = "ruff check"
pre_format = "ruff check --fix"
format = "ruff format"
run = "fastapi dev app/main.py"
pre_test = "task lint"
test = "python -m pytest -s -x --cov=app -vv"
post_test = "coverage html"


[tool.ruff.lint]
preview = true
select = ["I", "F", "E", "W", "PL", "PT"]

[tool.ruff]
line-length = 79
extend-exclude = ["database"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"