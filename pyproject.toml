[project]
name = "vacmais-backend"
version = "0.1.0"
description = "Backend do sistema Vac+"
authors = [
    {name = "VacMais"}
]
requires-python = ">=3.10, <4.0"
dependencies = [
    "fastapi[standard] (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "ruff (>=0.15.12,<0.16.0)",
    "typos (>=1.46.0,<2.0.0)"
]
[tool.taskipy.tasks]
run = "uvicorn app.main:app --reload"
lint = "ruff check ."
format = "ruff format ."
test = "pytest -s -x --cov=app -vv"

[tool.ruff]
line-length = 79
extend-exclude = ["migrations"]

[tool.ruff.lint]
preview = true
select = ["I", "F", "E", "W", "PL", "PT"]
